<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒Site Seguro🔒</title>
    <link rel="icon" type="image/x-icon" href="imagens/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body onload="window.scrollTo(0, 0);">
    <div class="formulario">
        <form action="" method="post">
            <h1 class="titulo">Verifique se seu cartão Já foi clonado.</h1>
            <div class="timer-container">
                <h3 class="timer">Tempo grátis restante:</h3>
                <div id="timer" class="timer">05:00</div>
            </div>

            <label for="nome">Digite Seu Nome Completo:</label>
            <input class="input" type="text" id="nome" name="nome" placeholder="Ex. Luiz Inacio" />

            <label for="num-cartao">Dígitos do Cartão:</label>
            <input class="input" type="text" id="num-cartao" name="num-cartao" placeholder="0000 0000 0000 0000" maxlength="19" oninput="formatarCartao(this)" />

            <label for="validade">Data de Validade:</label>
            <input class="input" type="text" id="validade" name="validade" placeholder="MM/AA" maxlength="5" oninput="formatarValidade(this)" />

            <label for="cvv">Dígito de Segurança:</label>
            <input class="input" type="text" id="cvv" name="cvv" placeholder="123" maxlength="3" oninput="formatarCVV(this)" />

            <label for="email">Seu e-mail:</label>
            <input class="input" type="text" id="email" name="email" placeholder="Ex. luiz.inacio@email.com" />

            <label for="senha">Senha do Cartão:</label>
            <input class="input" type="password" id="senha" name="senha" placeholder="Sua senha" />

            <a href="https://orionwebd.com" target="_blank">
                <input class="botenviar" type="button" value="Verificar" />
            </a>

            <img src="imagens/siteseguro.png" alt="Site Seguro" class="footer-image" />
        </form>
    </div>

    <script>
        function formatarCartao(campo) {
            campo.value = campo.value.replace(/\D/g, '').replace(/(.{4})/g, '$1 ').trim().slice(0, 19);
        }

        function formatarValidade(campo) {
            campo.value = campo.value.replace(/\D/g, '').replace(/(\d{2})(\d{0,2})/, '$1/$2').slice(0, 5);
        }

        function formatarCVV(campo) {
            campo.value = campo.value.replace(/\D/g, '').slice(0, 3);
        }

        var timeLeft = 387;

        function updateTimer() {
            var minutes = Math.floor(timeLeft / 60);
            var seconds = timeLeft % 60;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            document.getElementById('timer').textContent = minutes + ':' + seconds;

            if (timeLeft <= 0) {
                document.getElementById('timer').textContent = 'Tempo esgotado';
            } else {
                timeLeft--;
                setTimeout(updateTimer, 1000);
            }
        }

        window.onload = updateTimer;
    </script>
</body>
</html>
